services:
  postgres:
    image: postgres:16-alpine
    container_name: notes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: notesapp
      POSTGRES_PASSWORD: notesapp
      POSTGRES_DB: notes_memory_graph
    ports:
      - "5433:5432"
    volumes:
      - notes_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notes-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://notesapp:notesapp@postgres:5432/notes_memory_graph
      CORS_ORIGIN: "*"

      JWT_ACCESS_SECRET: super_long_dev_secret_change_this_later_123456789
      JWT_ACCESS_EXPIRES_IN: 1h
      BCRYPT_SALT_ROUNDS: 12

      HUGGINGFACE_API_KEY: ""
      HUGGINGFACE_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      HUGGINGFACE_BASE_URL: https://router.huggingface.co/hf-inference

      MEMORY_GRAPH_SIMILARITY_THRESHOLD: 0.72
      MEMORY_GRAPH_MAX_CONNECTIONS: 5
    ports:
      - "5000:5000"

volumes:
  notes_postgres_data:
